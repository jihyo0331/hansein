name: Deploy HANSEI LINK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync timetable and meals
        # 참고 사이트가 GitHub Actions IP를 일시 차단해도 마지막 성공 데이터로 배포합니다.
        continue-on-error: true
        run: node scripts/sync-neis.mjs
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NEIS_WEEK_OFFSETS: -1,0,1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
